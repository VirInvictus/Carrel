name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: theme invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The fork, beside this repo, so the logo-derivative byte-diffs run
      # here too (2026-09-15 gate: Carrel CI reddening on fork icon drift is
      # the designed signal, not a false alarm). The rendered
      # icon.png/favicon.ico pair still needs rsvg-convert/magick; the
      # script skips it with a note when the tools are absent, so CI
      # verifies the SVG byte-diff and leaves the renders to local
      # `just check`.
      - uses: actions/checkout@v7
        with:
          repository: VirInvictus/Carrel-calibre-web
          ref: smallscope
          path: fork

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # This repo holds no application code (spec 4.1). What is worth
      # guarding is the theme's contract, and scripts/check-theme.py's
      # docstring is the authoritative description of that guard; this file
      # deliberately does not restate it. The script is the same file
      # `just check` runs, so the two cannot drift.
      - name: Theme contract
        run: |
          python3 scripts/check-theme.py --selftest
          CARREL_FORK="$GITHUB_WORKSPACE/fork" python3 scripts/check-theme.py
