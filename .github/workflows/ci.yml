name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: theme invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # This repo holds no application code since Phase 8 retired the caliBlur
      # recolor generator (spec 4.1). What is worth guarding is the theme's
      # contract: every colour in the stylesheet AND the logo must come from
      # the Dragon palette declared in :root, the serif stack must not lead
      # with "EB Garamond" (which resolves to a sans), and no rule may target
      # caliBlur.
      #
      # The script lives in the repo rather than inline here so `just check`
      # runs the identical thing. It used to be an inline heredoc, which meant
      # the only way to exercise it was to push.
      - name: Theme contract
        run: python3 scripts/check-theme.py
