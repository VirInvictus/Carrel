name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: theme invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # This repo holds no application code (spec 4.1). What is worth
      # guarding is the theme's contract, and scripts/check-theme.py's
      # docstring is the authoritative description of that guard; this file
      # deliberately does not restate it. The script is the same file
      # `just check` runs, so the two cannot drift. The fork-side logo
      # derivative checks need the sibling fork checkout, which this
      # workflow does not perform; the script prints its skip note there,
      # and the full guard runs locally with the fork beside this repo.
      - name: Theme contract
        run: |
          python3 scripts/check-theme.py --selftest
          python3 scripts/check-theme.py
